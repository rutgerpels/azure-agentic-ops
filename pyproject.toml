[project]
name = "azure-agentic-ops"
version = "0.1.0"
description = "Named Azure Agentic Ops demo scenarios"
requires-python = ">=3.11,<3.14"
dependencies = [
  "azure-monitor-opentelemetry==1.8.11",
  "fastapi==0.162.0",
  "gunicorn==26.2.0; sys_platform != 'win32'",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "scenarios/retailx/tests/checkout", "scenarios/orderflow/tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded in VM cloud-init customData; edits force VM replacement.
"scenarios/retailx/app/checkout/onprem/*.py" = ["E501", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scenarios/retailx/chaos/checkout_latency.py"]
