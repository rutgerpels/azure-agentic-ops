[project]
name = "retailtx-checkout"
version = "0.1.0"
description = "Hybrid retail checkout latency and service-outage demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "azure-monitor-opentelemetry==1.8.11",
  "fastapi==0.143.0",
  "gunicorn==26.2.0; sys_platform != 'win32'",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests/checkout"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded in VM cloud-init customData; edits force VM replacement.
"app/checkout/onprem/*.py" = ["E501", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["chaos/checkout_latency.py"]
