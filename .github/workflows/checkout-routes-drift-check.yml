name: Checkout Routes Drift Check

# Read-only route comparison. The checkout-deploy environment requires a human
# reviewer and is restricted to demo/checkout.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkout-routes-deploy
  cancel-in-progress: false

jobs:
  check-routes:
    if: github.ref == 'refs/heads/demo/checkout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: checkout-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Entra workload federation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check declared price routes
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.CHECKOUT_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.CHECKOUT_WEBAPP_NAME }}
        run: |
          if (-not $env:RESOURCE_GROUP -or -not $env:WEBAPP_NAME) {
            throw 'Run scripts/Invoke-CheckoutDeployIdentity.ps1 Grant to set the checkout-deploy variables.'
          }
          ./scripts/Sync-CheckoutRoutes.ps1 Check -SubscriptionId $env:SUBSCRIPTION_ID `
            -ResourceGroup $env:RESOURCE_GROUP -WebAppName $env:WEBAPP_NAME
