name: SRE GitHub proposal intake

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: sre-github-intake-${{ github.repository_id }}-${{ github.event.issue.id }}
  cancel-in-progress: false

jobs:
  investigate:
    if: >-
      vars.SRE_INTAKE_ENABLED == 'true' &&
      github.repository == 'rutgerpels/retailtx-agentic-ops-demo' &&
      (github.event.action == 'opened' || github.event.label.name == 'sre-investigate') &&
      contains(github.event.issue.labels.*.name, 'sre-investigate') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: sre-github-intake
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      SRE_INTAKE_CONFIG: ${{ vars.SRE_INTAKE_CONFIG }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate private issue admission before Azure login
        id: admission
        run: python -m scripts.github.intake preflight
      - name: Entra workload federation
        if: steps.admission.outputs.needed == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.SRE_INTAKE_CLIENT_ID }}
          tenant-id: ${{ vars.SRE_INTAKE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Admit once, observe bounded result and update the originating issue
        if: steps.admission.outputs.needed == 'true'
        run: python -m scripts.github.intake run
