name: Copilot Setup Steps

# Runs before each Copilot cloud agent session. Manual dispatch and changes to this
# file validate OIDC login. The identity has no subscription role until
# scenarios/retailx/scripts/Invoke-CopilotCloudAgent.ps1 Grant assigns Reader on one checkout group.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: copilot
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot runs receive no Actions secrets; the login is validated after merge.
      - name: Entra workload federation
        if: github.actor != 'dependabot[bot]'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
