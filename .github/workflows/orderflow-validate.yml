name: OrderFlow validation

on:
  pull_request:
    paths:
      - scenarios/orderflow/**
      - scripts/Azure.Common.psm1
      - tests/**
      - pyproject.toml
      - requirements-dev.lock
      - .github/workflows/orderflow-*.yml
  push:
    branches: [main]
    paths:
      - scenarios/orderflow/**
      - scripts/Azure.Common.psm1
      - tests/**
      - pyproject.toml
      - requirements-dev.lock
      - .github/workflows/orderflow-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Restore pinned development environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Python contracts and lint
        run: |
          python -m pytest scenarios/orderflow/tests tests/test_repository_layout.py
          python -m ruff check scenarios/orderflow
      - name: PowerShell contracts
        shell: pwsh
        run: ./scenarios/orderflow/tests/Test-OrderFlow.ps1
      - name: Compile infrastructure without Azure login
        run: az bicep build --file scenarios/orderflow/infra/main.bicep --stdout > /dev/null
