name: OrderFlow validation

on:
  pull_request:
    paths:
      - scenarios/orderflow/**
      - scripts/Azure.Common.psm1
      - tests/**
      - pyproject.toml
      - requirements-dev.lock
      - .github/workflows/orderflow-*.yml
  push:
    branches: [main]
    paths:
      - scenarios/orderflow/**
      - scripts/Azure.Common.psm1
      - tests/**
      - pyproject.toml
      - requirements-dev.lock
      - .github/workflows/orderflow-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Restore pinned development environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Python contracts and lint
        run: |
          python -m pytest scenarios/orderflow/tests tests/test_repository_layout.py
          python -m ruff check scenarios/orderflow
      - name: PowerShell contracts
        shell: pwsh
        run: ./scenarios/orderflow/tests/Test-OrderFlow.ps1
      - name: Compile infrastructure without Azure login
        run: az bicep build --file scenarios/orderflow/infra/main.bicep --stdout > /dev/null
