name: SRE isolated read permission probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sre-read-probe-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  read-probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_type == 'branch' &&
      github.run_attempt == 1 &&
      github.repository == 'rutgerpels/retailtx-agentic-ops-demo' &&
      vars.SRE_READ_PROBE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: sre-read-probe
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      SRE_READ_PROBE_CONFIG: ${{ secrets.SRE_READ_PROBE_CONFIG }}
      SRE_READ_PROBE_BASELINE_CLIENT_ID: ${{ secrets.SRE_READ_PROBE_BASELINE_CLIENT_ID }}
      SRE_READ_PROBE_CANDIDATE_CLIENT_ID: ${{ secrets.SRE_READ_PROBE_CANDIDATE_CLIENT_ID }}
      SRE_READ_PROBE_TENANT_ID: ${{ secrets.SRE_READ_PROBE_TENANT_ID }}
    steps:
      - name: Check out the dispatched main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare only exact native configuration GETs
        run: python -m scripts.github.read_probe run
